name: Send Worker

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node send-worker.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEND_FROM: ${{ secrets.SEND_FROM }}
          SENDING_ENABLED: ${{ vars.SENDING_ENABLED }}
          RATE_LIMIT_PER_HOUR: ${{ vars.RATE_LIMIT_PER_HOUR }}
          RATE_LIMIT_PER_DAY: ${{ vars.RATE_LIMIT_PER_DAY }}
